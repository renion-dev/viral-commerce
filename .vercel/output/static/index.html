<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signal — Living Commerce World</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Loading screen -->
        <div id="loader">
            <div class="loader-ring"></div>
            <p class="loader-text">ENTERING THE SIGNAL</p>
        </div>

        <!-- 3D Canvas -->
        <canvas id="scene"></canvas>

        <!-- UI Overlay -->
        <div id="ui" class="hidden">
            <!-- Header -->
            <header id="header">
                <div class="logo">
                    <span class="logo-dot"></span>
                    <span class="logo-text">THE SIGNAL</span>
                </div>
                <nav id="nav">
                    <a href="#" class="nav-link active" data-view="world">World</a>
                    <a href="#" class="nav-link" data-view="discover">Discover</a>
                    <a href="#" class="nav-link" data-view="share">Share</a>
                </nav>
            </header>

            <!-- World Info -->
            <div id="world-info">
                <h1 id="world-name">Sleep Technology</h1>
                <p id="world-tagline">The $470B sleep economy is waking up</p>
                <div id="trend-score">
                    <span class="score-label">SIGNAL STRENGTH</span>
                    <span class="score-value">94</span>
                </div>
            </div>

            <!-- Products -->
            <div id="products"></div>

            <!-- Stories -->
            <div id="stories"></div>

            <!-- Share Panel -->
            <div id="share-panel" class="hidden">
                <h3>Share Your Discovery</h3>
                <div id="share-preview"></div>
                <button id="share-btn">Generate Share Card</button>
            </div>

            <!-- Footer -->
            <footer id="footer">
                <span>Powered by The Signal</span>
                <span class="separator">·</span>
                <span>Autonomous Commerce Lab</span>
            </footer>
        </div>
    </div>

    <!-- Three.js from CDN (free) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
