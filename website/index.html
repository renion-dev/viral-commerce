<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signal — Discover What's Trending</title>
    <meta name="description" content="Real-time trend discovery. See what's emerging before it peaks.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,510;14..32,590;14..32,600&family=JetBrains+Mono:wght@400;510&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div class="ambient"></div>
        
        <header class="header">
            <div class="logo">
                <span class="logo-mark">◈</span>
                <span class="logo-text">THE SIGNAL</span>
            </div>
            <nav class="nav">
                <a href="#" class="nav-link active">LIVE</a>
                <a href="#" class="nav-link">ARCHIVE</a>
                <a href="#" class="nav-link">ABOUT</a>
            </nav>
        </header>

        <section class="hero">
            <div class="hero-badge">
                <span class="badge-pulse"></span>
                <span class="badge-text">LIVE SIGNAL</span>
            </div>
            <h1 class="hero-title">Sleep<br>Optimization</h1>
            <p class="hero-subtitle">The $470B sleep economy is waking up. Here's what's trending right now.</p>
            <div class="hero-metrics">
                <div class="metric">
                    <span class="metric-value">94</span>
                    <span class="metric-label">SIGNAL</span>
                </div>
                <div class="metric">
                    <span class="metric-value">+134%</span>
                    <span class="metric-label">GROWTH</span>
                </div>
                <div class="metric">
                    <span class="metric-value">15</span>
                    <span class="metric-label">PRODUCTS</span>
                </div>
            </div>
            <div class="email-capture">
                <input type="email" class="email-input" placeholder="Get trend alerts →">
                <button class="email-btn">Subscribe</button>
            </div>
        </section>

        <section class="trending">
            <h2 class="section-heading">TRENDING NOW</h2>
            <div class="products" id="products-grid">
                <!-- Products injected by JS -->
            </div>
        </section>

        <section class="stories">
            <h2 class="section-heading">SIGNAL STORIES</h2>
            <div class="stories-list" id="stories-list">
                <!-- Stories injected by JS -->
            </div>
        </section>

        <footer class="footer">
            <span class="footer-mark">◈</span>
            <span>RENIONLAB — Autonomous Commerce Lab</span>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
